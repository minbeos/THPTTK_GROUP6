<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeXe - Tạo Tài Khoản</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Tùy chỉnh màu nền đúng tone tối sâu như trong ảnh */
    body {
      background-color: #121214;
    }
    .input-dark {
      background-color: #1c1c20;
      border: 1px solid #2a2a30;
      color: #f3f4f6;
    }
    .input-dark:focus-within {
      border-color: #ff5e14;
      box-shadow: 0 0 0 1px #ff5e14;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Khung chứa Form Đăng ký -->
  <div class="w-full max-w-lg bg-[#161619] border border-[#232328] rounded-3xl p-6 sm:p-8 shadow-2xl">
    
    <!-- (3) Tiêu đề Header -->
    <div class="mb-7">
      <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Tạo Tài Khoản</h1>
      <p class="text-sm text-gray-400 mt-1.5 font-normal">Hoàn tất đăng ký chỉ trong chưa đầy 2 phút.</p>
    </div>

    <!-- Form Đăng Ký -->
    <form id="registerForm" class="space-y-4">

      <!-- Hàng 1: Họ tên (4) & Số điện thoại (5) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- (4) Họ và Tên -->
        <div>
          <label class="block text-xs sm:text-sm font-semibold text-gray-200 mb-1.5">Họ và Tên</label>
          <div class="input-dark rounded-xl px-3.5 py-3 flex items-center gap-3 transition">
            <i class="fa-regular fa-user text-gray-400 text-sm"></i>
            <input 
              type="text" 
              id="fullName" 
              required 
              placeholder="Nhập họ tên" 
              class="w-full bg-transparent text-sm placeholder-gray-500 focus:outline-none"
            />
          </div>
        </div>

        <!-- (5) Số Điện Thoại -->
        <div>
          <label class="block text-xs sm:text-sm font-semibold text-gray-200 mb-1.5">Số Điện Thoại</label>
          <div class="input-dark rounded-xl px-3.5 py-3 flex items-center gap-3 transition">
            <i class="fa-solid fa-phone text-gray-400 text-sm"></i>
            <input 
              type="tel" 
              id="phone" 
              required 
              maxlength="10"
              placeholder="Nhập số điện thoại" 
              class="w-full bg-transparent text-sm placeholder-gray-500 focus:outline-none"
            />
          </div>
        </div>
      </div>

      <!-- Hàng 2: Email (6) & CCCD (7) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- (6) Địa Chỉ Email -->
        <div>
          <label class="block text-xs sm:text-sm font-semibold text-gray-200 mb-1.5">Địa Chỉ Email</label>
          <div class="input-dark rounded-xl px-3.5 py-3 flex items-center gap-3 transition">
            <i class="fa-regular fa-envelope text-gray-400 text-sm"></i>
            <input 
              type="email" 
              id="email" 
              required 
              placeholder="Nhập email" 
              class="w-full bg-transparent text-sm placeholder-gray-500 focus:outline-none"
            />
          </div>
        </div>

        <!-- (7) CCCD -->
        <div>
          <label class="block text-xs sm:text-sm font-semibold text-gray-200 mb-1.5">CCCD</label>
          <div class="input-dark rounded-xl px-3.5 py-3 flex items-center gap-3 transition">
            <i class="fa-regular fa-id-card text-gray-400 text-sm"></i>
            <input 
              type="text" 
              id="cccd" 
              required 
              maxlength="12"
              placeholder="Nhập CCCD" 
              class="w-full bg-transparent text-sm placeholder-gray-500 focus:outline-none"
            />
          </div>
        </div>
      </div>

      <!-- (8) Mật Khẩu -->
      <div>
        <label class="block text-xs sm:text-sm font-semibold text-gray-200 mb-1.5">Mật Khẩu</label>
        <div class="input-dark rounded-xl px-3.5 py-3 flex items-center gap-3 transition">
          <i class="fa-solid fa-lock text-gray-400 text-sm"></i>
          <input 
            type="password" 
            id="password" 
            required 
            placeholder="••••••••" 
            class="w-full bg-transparent text-sm placeholder-gray-500 focus:outline-none"
          />
          <button type="button" class="toggle-password text-gray-400 hover:text-gray-200 focus:outline-none" data-target="password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- (9) Xác Nhận Mật Khẩu -->
      <div>
        <label class="block text-xs sm:text-sm font-semibold text-gray-200 mb-1.5">Xác Nhận Mật Khẩu</label>
        <div class="input-dark rounded-xl px-3.5 py-3 flex items-center gap-3 transition">
          <i class="fa-solid fa-lock text-gray-400 text-sm"></i>
          <input 
            type="password" 
            id="confirmPassword" 
            required 
            placeholder="••••••••" 
            class="w-full bg-transparent text-sm placeholder-gray-500 focus:outline-none"
          />
          <button type="button" class="toggle-password text-gray-400 hover:text-gray-200 focus:outline-none" data-target="confirmPassword">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
        <!-- Thông báo lỗi mật khẩu không khớp -->
        <p id="passwordError" class="text-xs text-red-500 mt-1 hidden">Mật khẩu xác nhận không trùng khớp!</p>
      </div>

      <!-- (10) Nút Đăng Ký -->
      <div class="pt-3">
        <button 
          type="submit" 
          class="w-full bg-[#ff5e14] hover:bg-[#e6520f] active:scale-[0.99] text-white py-3.5 rounded-2xl font-bold text-base shadow-lg shadow-orange-600/30 flex items-center justify-center gap-2 transition duration-200"
        >
          <span>Đăng Ký</span>
          <i class="fa-solid fa-arrow-right text-sm"></i>
        </button>
      </div>

      <!-- Chuyển sang Đăng nhập -->
      <p class="text-center text-xs text-gray-400 pt-2">
        Đã có tài khoản? 
        <a href="#" class="text-[#ff5e14] hover:underline font-semibold">Đăng nhập ngay</a>
      </p>

    </form>
  </div>

  <!-- JavaScript xử lý tương tác -->
  <script>
    // 1. Tính năng Bật / Tắt hiển thị mật khẩu (con mắt)
    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', function() {
        const targetId = this.getAttribute('data-target');
        const input = document.getElementById(targetId);
        const icon = this.querySelector('i');

        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        }
      });
    });

    // 2. Chỉ cho phép nhập số ở trường SĐT và CCCD
    ['phone', 'cccd'].forEach(id => {
      document.getElementById(id).addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
      });
    });

    // 3. Xử lý gửi Form & Kiểm tra khớp mật khẩu
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const pwd = document.getElementById('password').value;
      const confirmPwd = document.getElementById('confirmPassword').value;
      const pwdError = document.getElementById('passwordError');
      const cccd = document.getElementById('cccd').value;
      const phone = document.getElementById('phone').value;

      // Kiểm tra SĐT 10 số
      if (phone.length !== 10) {
        alert('Số điện thoại phải gồm đúng 10 chữ số!');
        return;
      }

      // Kiểm tra CCCD 12 số
      if (cccd.length !== 12) {
        alert('Căn cước công dân (CCCD) phải đủ 12 chữ số!');
        return;
      }

      // Kiểm tra mật khẩu trùng khớp
      if (pwd !== confirmPwd) {
        pwdError.classList.remove('hidden');
        return;
      } else {
        pwdError.classList.add('hidden');
      }

      alert('Đăng ký tài khoản SafeXe thành công! Đang chuyển hướng...');
    });
  </script>
</body>
</html>

{% extends 'web_base.html' %}
{% block title %}SafeXe - Đặt Lại Thành Công{% endblock %}
{% block content %}
<div class="space-y-space-md">
    <div class="text-center">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-tertiary-fixed text-tertiary mb-3 shadow-sm">
            <span class="material-symbols-outlined text-[28px]">check_circle</span>
        </div>
        <h2 class="font-headline-md text-headline-md text-on-surface font-bold text-center">Thành Công</h2>

    </div>
    
    <div class="pt-2">
        <a href="{% url 'home' %}" class="w-full h-12 rounded-lg bg-primary-container hover:bg-primary text-on-primary-container font-headline-sm text-headline-sm font-bold flex items-center justify-center gap-2 shadow-[0_8px_20px_rgba(216,58,0,0.32)] active:scale-[0.98] transition-all duration-200">
            <span class="material-symbols-outlined text-[20px]">login</span>
            <span>ĐĂNG NHẬP NGAY</span>
        </a>
    </div>
</div>

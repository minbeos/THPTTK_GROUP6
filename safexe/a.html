<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeXe - Gửi Yêu Cầu Cứu Hộ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex justify-center p-0 sm:p-4">

  <!-- Mobile Screen Container -->
  <div class="w-full max-w-md bg-white min-h-screen sm:min-h-0 sm:rounded-3xl shadow-xl flex flex-col overflow-hidden pb-6">
    
    <!-- Top Header -->
    <header class="bg-red-600 text-white px-5 py-4 flex items-center justify-between sticky top-0 z-20 shadow-md">
      <div class="flex items-center gap-3">
        <button type="button" class="text-white hover:opacity-80 p-1" title="Quay lại">
          <i class="fa-solid fa-arrow-left text-lg"></i>
        </button>
        <div>
          <h1 class="font-bold text-lg leading-tight">Gửi yêu cầu sự cố</h1>
          <p class="text-xs text-red-100 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Tự động quét trong bán kính 10km
          </p>
        </div>
      </div>
      <!-- AI Quick Chat -->
      <button type="button" class="bg-white/20 hover:bg-white/30 text-xs px-2.5 py-1.5 rounded-full flex items-center gap-1.5 transition">
        <i class="fa-solid fa-robot text-amber-300"></i>
        <span class="font-medium">Hỏi AI</span>
      </button>
    </header>

    <!-- Main Form -->
    <form id="rescueForm" class="p-5 space-y-5 flex-1 text-sm">

      <!-- 1. Vị trí & Định vị GPS -->
      <div class="bg-red-50/60 border border-red-200/80 rounded-2xl p-3.5 space-y-2">
        <div class="flex items-center justify-between">
          <span class="font-bold text-slate-800 flex items-center gap-1.5 text-xs">
            <i class="fa-solid fa-location-dot text-red-600"></i> Vị trí gặp sự cố (*)
          </span>
          <button type="button" id="btnRefreshGPS" class="text-xs text-red-600 font-semibold hover:underline flex items-center gap-1">
            <i class="fa-solid fa-crosshairs"></i> Định vị lại
          </button>
        </div>
        <div class="relative">
          <input 
            type="text" 
            id="locationInput" 
            required 
            value="120 Hoàng Minh Thảo, P. Hòa Khánh Nam, Liên Chiểu, Đà Nẵng"
            class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-700 pr-8 focus:ring-2 focus:ring-red-500 focus:outline-none shadow-sm" 
          />
          <i class="fa-solid fa-circle-check text-emerald-500 absolute right-2.5 top-2.5 text-xs"></i>
        </div>
        <input 
          type="text" 
          placeholder="Mô tả cột mốc nhận diện (VD: Đối diện cổng trường, cây xăng số 5...)" 
          class="w-full bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-600 focus:ring-1 focus:ring-red-500 focus:outline-none" 
        />
      </div>

      <!-- 2. Dropdown Chọn loại phương tiện (Kèm ô nhập nếu chọn "Khác") -->
      <div class="space-y-2">
        <label for="vehicleSelect" class="font-bold text-slate-700 flex items-center gap-1">
          <i class="fa-solid fa-motorcycle text-slate-500 text-xs"></i>
          1. Loại phương tiện <span class="text-red-500">*</span>
        </label>
        
        <div class="relative">
          <select 
            id="vehicleSelect" 
            required 
            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 focus:ring-2 focus:ring-red-500 focus:outline-none appearance-none cursor-pointer"
          >
            <option value="" disabled selected>-- Chọn loại phương tiện của bạn --</option>
            <option value="motorcycle">Xe máy (xe xăng)</option>
            <option value="car">Ô tô</option>
            <option value="electric_bike">Xe máy điện / Xe đạp điện</option>
            <option value="bicycle">Xe đạp</option>
            <option value="other_vehicle" class="font-bold text-red-600">Phương tiện khác (Tự ghi...)</option>
          </select>
          <i class="fa-solid fa-chevron-down absolute right-3.5 top-3.5 text-slate-400 pointer-events-none text-xs"></i>
        </div>

        <!-- Ô nhập loại phương tiện khi chọn "Phương tiện khác" (Ẩn mặc định) -->
        <div id="otherVehicleContainer" class="hidden transition-all duration-300 bg-red-50/70 p-3 rounded-xl border border-red-200 space-y-1.5">
          <label for="otherVehicleText" class="text-xs font-semibold text-red-700 flex items-center gap-1">
            <i class="fa-solid fa-pen"></i> Tên/loại phương tiện cụ thể: <span class="text-red-500">*</span>
          </label>
          <input 
            type="text" 
            id="otherVehicleText"
            placeholder="Ví dụ: Xe ba gác chở hàng, Xe tải nhỏ, Xe xích lô..." 
            class="w-full bg-white border border-red-300 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-red-500 focus:outline-none"
          />
        </div>
        
        <!-- Nhãn hiệu & Biển số xe -->
        <input 
          type="text" 
          placeholder="Tên xe / Màu sắc / Biển số (VD: Vision đỏ - 43C1-123.45)" 
          class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-red-500 focus:outline-none"
        />
      </div>

      <!-- 3. Dropdown Loại sự cố (Có sẵn / Khác) -->
      <div class="space-y-2">
        <label for="issueSelect" class="font-bold text-slate-700 flex items-center gap-1">
          <i class="fa-solid fa-triangle-exclamation text-amber-500 text-xs"></i>
          2. Loại sự cố gặp phải <span class="text-red-500">*</span>
        </label>
        
        <div class="relative">
          <select 
            id="issueSelect" 
            required 
            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 focus:ring-2 focus:ring-red-500 focus:outline-none appearance-none cursor-pointer"
          >
            <option value="" disabled selected>-- Chọn sự cố cần hỗ trợ --</option>
            <option value="puncture">Thủng xăm / Xẹp lốp / Nổ lốp</option>
            <option value="fuel" id="optFuel">Hết xăng giữa đường</option>
            <option value="battery">Hỏng bình ắc quy / Cần kích nổ bình</option>
            <option value="engine">Chết máy / Không khởi động được</option>
            <option value="chain">Đứt xích / Tuột xích / Kẹt líp</option>
            <option value="brake">Hỏng phanh / Kẹt bánh không di chuyển được</option>
            <option value="key">Quên / Mất chìa khóa / Kẹt ổ khóa</option>
            <option value="other_issue" class="font-bold text-red-600">Sự cố khác (Tự mô tả...)</option>
          </select>
          <i class="fa-solid fa-chevron-down absolute right-3.5 top-3.5 text-slate-400 pointer-events-none text-xs"></i>
        </div>

        <!-- Ô nhập chi tiết khi chọn "Sự cố khác" (Ẩn mặc định) -->
        <div id="otherIssueContainer" class="hidden transition-all duration-300 bg-red-50/70 p-3 rounded-xl border border-red-200 space-y-1.5">
          <label for="otherIssueText" class="text-xs font-semibold text-red-700 flex items-center gap-1">
            <i class="fa-solid fa-pen"></i> Mô tả chi tiết sự cố khác: <span class="text-red-500">*</span>
          </label>
          <textarea 
            id="otherIssueText"
            rows="2" 
            placeholder="Ví dụ: Xe bị gãy chân chống, vỡ gương, rò rỉ nhớt dưới gầm xe..."
            class="w-full bg-white border border-red-300 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-red-500 focus:outline-none"
          ></textarea>
        </div>
      </div>

      <!-- 4. Tải ảnh hiện trường -->
      <div class="space-y-1.5">
        <label class="font-bold text-slate-700 flex items-center justify-between">
          <span class="flex items-center gap-1">
            <i class="fa-solid fa-camera text-slate-500 text-xs"></i>
            Hình ảnh sự cố (Nếu có)
          </span>
          <span class="text-xs font-normal text-slate-400">Tối đa 3 ảnh</span>
        </label>
        
        <div class="flex items-center gap-3">
          <label class="w-20 h-20 border-2 border-dashed border-slate-300 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:bg-slate-50 text-slate-500 transition active:scale-95">
            <i class="fa-solid fa-camera text-xl mb-1 text-slate-400"></i>
            <span class="text-[10px] font-medium">Thêm ảnh</span>
            <input type="file" id="fileUpload" accept="image/*" class="hidden" multiple />
          </label>
          <p class="text-xs text-slate-500 leading-relaxed">
            Chụp hoặc tải ảnh chỗ hỏng để người hỗ trợ chuẩn bị đúng đồ nghề (vá lốp, kích bình, xăng dự phòng...).
          </p>
        </div>
        <!-- Vùng hiển thị tên ảnh tải lên -->
        <div id="fileList" class="text-xs text-emerald-600 font-medium"></div>
      </div>

      <!-- Action Buttons -->
      <div class="pt-4 space-y-2.5">
        <!-- Nút gửi cứu hộ -->
        <button 
          type="submit" 
          class="w-full bg-red-600 hover:bg-red-700 active:scale-[0.99] text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-red-500/30 flex items-center justify-center gap-2 text-base transition"
        >
          <i class="fa-solid fa-tower-broadcast animate-bounce"></i>
          PHÁT TÍN HIỆU CỨU HỘ
        </button>

        <!-- Nút Trợ lý AI -->
        <button 
          type="button" 
          class="w-full bg-slate-100 hover:bg-slate-200 active:scale-[0.99] text-slate-700 py-2.5 rounded-xl font-semibold flex items-center justify-center gap-2 text-xs transition"
        >
          <i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i>
          Chưa rõ lỗi? Nhờ Trợ lý AI Chẩn đoán nhanh
        </button>
      </div>

    </form>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Elements
    const vehicleSelect = document.getElementById('vehicleSelect');
    const otherVehicleContainer = document.getElementById('otherVehicleContainer');
    const otherVehicleText = document.getElementById('otherVehicleText');

    const issueSelect = document.getElementById('issueSelect');
    const otherIssueContainer = document.getElementById('otherIssueContainer');
    const otherIssueText = document.getElementById('otherIssueText');
    const optFuel = document.getElementById('optFuel');

    const fileUpload = document.getElementById('fileUpload');
    const fileList = document.getElementById('fileList');

    // 1. Logic khi chọn Loại phương tiện
    vehicleSelect.addEventListener('change', function() {
      // Khi chọn "Phương tiện khác" -> Hiện ô nhập tên phương tiện
      if (this.value === 'other_vehicle') {
        otherVehicleContainer.classList.remove('hidden');
        otherVehicleText.setAttribute('required', 'true');
        otherVehicleText.focus();
      } else {
        otherVehicleContainer.classList.add('hidden');
        otherVehicleText.removeAttribute('required');
      }

      // Đổi nhãn năng lượng tương ứng theo loại xe
      if (this.value === 'electric_bike') {
        optFuel.textContent = 'Cạn pin / Hết điện giữa đường';
      } else if (this.value === 'bicycle') {
        optFuel.textContent = 'Gãy pê-đan / Hỏng líp';
      } else {
        optFuel.textContent = 'Hết xăng giữa đường';
      }
    });

    // 2. Logic khi chọn Loại sự cố
    issueSelect.addEventListener('change', function() {
      // Khi chọn "Sự cố khác" -> Hiện ô nhập mô tả chi tiết sự cố
      if (this.value === 'other_issue') {
        otherIssueContainer.classList.remove('hidden');
        otherIssueText.setAttribute('required', 'true');
        otherIssueText.focus();
      } else {
        otherIssueContainer.classList.add('hidden');
        otherIssueText.removeAttribute('required');
      }
    });

    // 3. Hiển thị số lượng ảnh đã chọn
    fileUpload.addEventListener('change', function() {
      if (this.files.length > 0) {
        fileList.textContent = `✓ Đã chọn ${this.files.length} ảnh hiện trường`;
      } else {
        fileList.textContent = '';
      }
    });

    // 4. Xử lý khi nhấn nút gửi
    document.getElementById('rescueForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const vehicleName = vehicleSelect.value === 'other_vehicle' 
        ? otherVehicleText.value 
        : vehicleSelect.options[vehicleSelect.selectedIndex].text;

      const issueName = issueSelect.value === 'other_issue' 
        ? otherIssueText.value 
        : issueSelect.options[issueSelect.selectedIndex].text;
      
      alert(`Đã phát tín hiệu cứu hộ thành công!\n- Loại phương tiện: ${vehicleName}\n- Sự cố gặp phải: ${issueName}\n\nHệ thống SafeXe đang quét người hỗ trợ trong bán kính 10km quanh bạn.`);
    });
  </script>
</body>
</html>
